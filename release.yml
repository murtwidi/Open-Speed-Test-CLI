name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: ospeedtest-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: ospeedtest-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            asset_name: ospeedtest-linux-armv7
          - goos: windows
            goarch: amd64
            asset_name: ospeedtest-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            asset_name: ospeedtest-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: ospeedtest-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.asset_name }} .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          body_path: CHANGELOG.md
